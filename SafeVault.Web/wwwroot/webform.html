<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeVault Secure Web Form</title>
</head>
<body>
    <main>
        <h1>SafeVault Secure Submission</h1>
        <form action="/submit" method="post" autocomplete="off">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" maxlength="100" required>

            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>Written by Brian McCarthy</footer>
</body>
</html>
